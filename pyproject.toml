[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerloom"
version = "0.1.0"
description = "Deterministic ledger ingestion and reconciliation for Python"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Kareem Hassan", email = "kareembalzz0@gmail.com" },
]
keywords = ["ledger", "reconciliation", "audit", "accounting"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy==1.17.1",
    "pytest==9.1.1",
    "pytest-cov==6.2.1",
    "ruff==0.12.9",
]

[project.urls]
Repository = "https://github.com/kareemhassanx1/ledgerloom"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ledgerloom = ["py.typed"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config -ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["ledgerloom"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ledgerloom"]

