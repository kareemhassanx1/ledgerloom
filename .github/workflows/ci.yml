name: CI

on:
  push:
    branches:
      - main
      - 'recovery/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, tests, and package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install development dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Type-check source
        run: python -m mypy

      - name: Test with coverage
        run: >-
          python -m pytest -q
          --cov=ledgerloom
          --cov-report=term-missing
          --cov-fail-under=85

      - name: Build wheel
        run: python -m pip wheel --disable-pip-version-check --no-deps --wheel-dir dist .

      - name: Verify packaged sources
        run: python scripts/verify_wheel.py dist/*.whl

      - name: Smoke-test built wheel
        shell: bash
        run: |
          python -m venv .wheel-smoke
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            .wheel-smoke/Scripts/python -m pip install --disable-pip-version-check --no-deps dist/*.whl
            .wheel-smoke/Scripts/ledgerloom --help
          else
            .wheel-smoke/bin/python -m pip install --disable-pip-version-check --no-deps dist/*.whl
            .wheel-smoke/bin/ledgerloom --help
          fi

  dependency-container:
    name: Offline supplied-checkout Docker verification
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build dependency-only image
        run: docker build --tag ledgerloom-deps:ci .
      - name: Verify supplied checkout with networking disabled
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none \
            --mount "type=bind,source=$PWD,target=/checkout,readonly" \
            --tmpfs /work:exec \
            ledgerloom-deps:ci sh -ec '
              cp -R /checkout/. /work/
              cd /work
              python -m pip install --no-index --no-deps --no-build-isolation .
              python -m pip check
              python -m pytest -q --cov=ledgerloom --cov-fail-under=85
              python -m pip wheel --no-index --no-deps --no-build-isolation --wheel-dir /tmp/wheels .
              python scripts/verify_wheel.py /tmp/wheels/*.whl
              python -m ledgerloom audit --help
              python -m ledgerloom backup --help
            '
