name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, tests, and package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Type-check source
        run: python -m mypy

      - name: Test with coverage
        run: >-
          python -m pytest -q
          --cov=ledgerloom
          --cov-report=term-missing
          --cov-fail-under=85

      - name: Build wheel
        run: python -m pip wheel --disable-pip-version-check --no-deps --wheel-dir dist .

      - name: Smoke-test built wheel
        shell: bash
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install --disable-pip-version-check --no-deps dist/*.whl
          .wheel-smoke/bin/ledgerloom --help
